<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The War Garage: Battle Reports</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!--
  HOW TO ADD A NEW BATTLE REPORT
  1. Copy the folder  reports/_template  and rename the copy, e.g.  reports/battle-02
  2. Edit reports/battle-02/index.html (text), and put its photos in images/ and maps in maps/.
  3. Copy one <a class="card"> block below, put it ABOVE the others (newest first),
     and change the link, photo, title and text.
  4. In the older report, add a "Next battle" link in its <nav class="pager"> at the bottom.
-->
    <main class="report">
      <header>
        <h1>The War Garage</h1>
        <p class="tagline">Battle Reports</p>
      </header>

      <section class="cards">

        <a class="card" href="reports/battle-01/index.html">
          <img src="reports/battle-01/images/battle-01.jpg" alt="The battlefield before the first move">
          <div class="card-text">
            <h2>Battle Report 1</h2>
            <p class="meta">High Elves &amp; Skaven vs Orcs &amp; Undead</p>
            <p>An uneasy alliance of High Elves and Skaven defends an Old World outpost against an ambush by Orcs and Undead.</p>
          </div>
        </a>

      </section>
    </main>
  </body>

</html>
