<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>The War Garage: Battle Report</title>
    <link rel="stylesheet" href="../../style.css?v=3">
  </head>
  <body>
    <!--
  HOW TO EDIT
  - Change any text between the tags, e.g. <p>change me</p>.
  - Each move is one <section class="turn"> block. Copy/paste a block to add a move, delete one to remove it.
  - A map is a <figure class="map"> block. Put its PNG in the images folder.
  - Images live in this report's "images" folder. Swap the file name in src="..." to change a picture.
  - Styling (colours, fonts, sizes) is all in ../../style.css.
-->
    <nav class="topnav"><a href="../../index.html">&larr; All battle reports</a></nav>
    <main class="report">
      <header>
        <h1>The War Garage: Battle Report</h1>
      </header>
      <section class="setup">
        <h2>Background</h2>
        <p class="intro">Write the background here.</p>
        <img src="images/battle-01.jpg" alt="The battlefield at the start of the game">
      </section>
      <section class="turn">
        <img src="images/battle-02.jpg" alt="Move 1">
        <div class="caption">
          <p>Describe the first move here.</p>
        </div>
      </section>
      <figure class="map">
        <img src="images/map-01.png" alt="Map of the battlefield after move 1">
      </figure>
      <footer>
        <h2>Result</h2>
        <p>Write the result here.</p>
      </footer>
      <nav class="pager">
        <a class="prev" href="../battle-01/index.html">&larr; Previous battle</a>
        <a class="all" href="../../index.html">All battle reports</a>
      </nav>
    </main>
  </body>
</html>
